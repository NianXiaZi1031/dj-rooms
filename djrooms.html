<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一只饿困喵.（lI念夏子lI）的小房子 🎧</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #0f0f2b, #000);
    color: #fff;
    font-family: "Poppins", sans-serif;
    text-align: center;
    overflow: hidden;
  }
  h1 {
    margin-top: 20px;
    font-size: 1.8em;
    text-shadow: 0 0 15px #0ff;
  }
  #light {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,255,255,0.2), transparent);
    mix-blend-mode: screen;
    z-index: -1;
    transition: background 0.2s ease;
  }
  button, input[type="file"] {
    background: #0ff;
    color: #000;
    border: none;
    padding: 10px 18px;
    margin: 8px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
  }
  button:hover {
    transform: scale(1.1);
    background: #fff;
  }
  .controls {
    margin-top: 40px;
  }
  audio {
    display: none;
  }
  .hint {
    margin-top: 20px;
    opacity: 0.8;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<h1>🎵 一只饿困喵.（lI念夏子lI）的小房子 🎶</h1>
<div id="light"></div>

<div class="controls">
  <button onclick="playMusic('A')">A - EDM Drop</button>
  <button onclick="playMusic('S')">S - Trap</button>
  <button onclick="playMusic('D')">D - Techno</button>
  <button onclick="playMusic('F')">F - Chillwave</button><br>
  <input type="file" id="fileInput" accept="audio/*">
</div>

<p class="hint">💡 小贴士：你也可以按键盘 A / S / D / F 来播放节奏</p>

<!-- 改动点：把原来的外部 mp3 链接换成 GitHub Pages 可用的同目录文件名 -->
<audio id="audioA" src="偶像商店.mp3"></audio>
<audio id="audioS" src="偶像商店.mp3"></audio>
<audio id="audioD" src="偶像商店.mp3"></audio>
<audio id="audioF" src="偶像商店.mp3"></audio>
<audio id="uploadAudio"></audio>

<script>
const light = document.getElementById('light');
const uploadAudio = document.getElementById('uploadAudio');
const input = document.getElementById('fileInput');

input.addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    uploadAudio.src = URL.createObjectURL(file);
    uploadAudio.play();
  }
});

function playMusic(key){
  let audioId = 'audio' + key;
  const audio = document.getElementById(audioId);
  audio.currentTime = 0;
  audio.play();
  flashLight();
}

function flashLight(){
  const colors = ['#0ff','#f0f','#ff0','#0f0','#f00','#00f'];
  const c = colors[Math.floor(Math.random() * colors.length)];
  light.style.background = `radial-gradient(circle, ${c}44, transparent)`;
  setTimeout(() => light.style.background = 'none', 200);
}

document.addEventListener('keydown', (e)=>{
  const key = e.key.toUpperCase();
  if(['A','S','D','F'].includes(key)) playMusic(key);
});
</script>

</body>
</html>
